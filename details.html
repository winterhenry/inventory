<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instrument Details</title>
    <style>
        /* Mobile-friendly styling */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            text-align: center;
            box-sizing: border-box;
        }
        .category {
            text-transform: uppercase;
            font-size: 11px;
            font-weight: bold;
            color: #86868b;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        h1 {
            font-size: 28px;
            margin: 0 0 15px 0;
            color: #1d1d1f;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #515154;
            margin: 0;
        }
        .error {
            color: #ff453a;
        }
    </style>
</head>
<body>

    <div class="card" id="display-card">
        <div class="category" id="instrument-category">Category</div>
        <h1 id="instrument-name">Loading...</h1>
        <p id="instrument-description">Please wait while the description loads.</p>
    </div>

    <script>
        // 1. Read the "?item=" parameter from the NFC scan URL
        const urlParams = new URLSearchParams(window.location.search);
        const itemID = urlParams.get('item');

        // 2. Your Instrument Database
        // You can easily add more instruments to this list by following the format.
        const instruments = {
            "saxophone": {
                name: "Saxophone",
                category: "Woodwind Instrument",
                desc: "The saxophone is a family of woodwind instruments usually made of brass and played with a single-reed mouthpiece. Invented by Adolphe Sax in the 1840s, it is widely used in classical, marching band, and jazz music."
            },
            "trumpet": {
                name: "Trumpet",
                category: "Brass Instrument",
                desc: "The trumpet is a brass instrument with a bright, powerful tone. It is played by blowing air through closed lips, producing a 'buzzing' sound that starts a standing wave vibration in the air column inside the instrument."
            },
            "guitar": {
                name: "Acoustic Guitar",
                category: "String Instrument",
                desc: "A fretted musical instrument that typically has six strings. Sound is projected either acoustically through a hollow wooden body, or through electrical amplification."
            },
            "violin": {
                name: "Violin",
                category: "String Instrument",
                desc: "Sometimes known as a fiddle, the violin is a wooden string instrument in the violin family. Most violins have a hollow wooden body and are played by drawing a bow across its four strings."
            }
        };

        // 3. Update the HTML elements with the correct instrument details
        if (itemID && instruments[itemID]) {
            const data = instruments[itemID];
            document.getElementById('instrument-category').innerText = data.category;
            document.getElementById('instrument-name').innerText = data.name;
            document.getElementById('instrument-description').innerText = data.desc;
        } else {
            // Error handling if the scanned code doesn't exist
            document.getElementById('instrument-category').innerText = "Error";
            document.getElementById('instrument-category').classList.add('error');
            document.getElementById('instrument-name').innerText = "Instrument Not Found";
            document.getElementById('instrument-description').innerText = "This NFC sticker is programmed with an invalid or missing instrument ID.";
        }
    </script>
</body>
</html>
