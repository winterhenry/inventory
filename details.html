<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instrument Inventory</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }
        .category {
            text-transform: uppercase;
            font-size: 11px;
            font-weight: bold;
            color: #86868b;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-align: center;
        }
        h1 {
            font-size: 26px;
            margin: 0 0 15px 0;
            color: #1d1d1f;
            text-align: center;
        }
        p {
            font-size: 15px;
            line-height: 1.6;
            color: #515154;
            margin: 0 0 15px 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1d1d1f;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: #0071e3;
            background-color: #ffffff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0071e3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0077ed;
        }
        .details-box {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e5e5e5;
        }
        .error {
            color: #ff453a;
        }
        .divider {
            text-align: center;
            margin: 10px 0;
            font-size: 12px;
            color: #86868b;
            font-weight: bold;
        }
    </style>
    <!-- PapaParse parses the Excel/CSV file -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

    <div class="card">
        <div class="category" id="display-category">Inventory</div>
        <h1 id="display-title">Loading...</h1>
        <p id="display-desc">Please wait while the database loads.</p>

        <!-- Search & Selection Section (Hidden until loaded) -->
        <div id="search-section" style="display: none;">
            <div class="form-group">
                <label for="code-select">Select Specific Code:</label>
                <select id="code-select">
                    <option value="">-- Choose from List --</option>
                </select>
            </div>

            <div class="divider">OR</div>

            <div class="form-group">
                <label for="code-search">Search by Code:</label>
                <input type="text" id="code-search" placeholder="Type code (e.g., sax-045)">
            </div>
            
            <button id="search-btn">View Instrument Details</button>
        </div>

        <!-- Details Display Section (Hidden until an item is chosen) -->
        <div class="details-box" id="details-section" style="display: none;">
            <h2 id="item-name" style="font-size: 20px; margin: 0 0 10px 0;">Instrument Name</h2>
            <p><strong>Specific Code:</strong> <span id="item-code">N/A</span></p>
            <p id="item-desc">Instrument description will appear here.</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const itemQuery = urlParams.get('item'); // e.g., "saxophone" or "sax-045"

        let globalDatabase = [];

        if (itemQuery) {
            fetch('inventory.csv')
                .then(response => {
                    if (!response.ok) throw new Error("Could not fetch inventory.csv");
                    return response.text();
                })
                .then(csvText => {
                    Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: true,
                        complete: function(results) {
                            globalDatabase = results.data;
                            processQuery(itemQuery.trim().toLowerCase());
                        }
                    });
                })
                .catch(err => {
                    showError("Connection Error", "Could not load the database file.");
                    console.error(err);
                });
        } else {
            showError("Invalid Scan", "No category or item code was detected in the URL.");
        }

        function processQuery(query) {
            // 1. Check if the scanned ID is a specific instrument (e.g., sax-045)
            const specificItem = globalDatabase.find(row => row.id && row.id.trim().toLowerCase() === query);

            if (specificItem) {
                // If it is a specific item, display it directly, but also load the search/selector for its category
                displayItem(specificItem);
                setupSearchSection(specificItem.category.trim().toLowerCase(), specificItem.id);
            } else {
                // 2. Otherwise, check if they scanned a general category (e.g., saxophone)
                const categoryExists = globalDatabase.some(row => row.category && row.category.trim().toLowerCase() === query);

                if (categoryExists) {
                    // Try to find the general category information row (where id matches the category name)
                    const generalRow = globalDatabase.find(row => row.id && row.id.trim().toLowerCase() === query);
                    
                    document.getElementById('display-category').innerText = query;
                    document.getElementById('display-title').innerText = generalRow ? generalRow.name : (query.charAt(0).toUpperCase() + query.slice(1) + "s");
                    document.getElementById('display-desc').innerText = generalRow ? generalRow.desc : "Select or search for a specific code below.";
                    
                    setupSearchSection(query, null);
                } else {
                    showError("Not Found", "No category or specific code matches '" + query + "'.");
                }
            }
        }

        // Sets up the search bar and dropdown list filtered by the specific category
        function setupSearchSection(categoryName, currentSelectedId) {
            const selectEl = document.getElementById('code-select');
            
            // Filter database to get all items belonging to this category (excluding the general landing row)
            const categoryItems = globalDatabase.filter(row => 
                row.category && row.category.trim().toLowerCase() === categoryName &&
                row.id && row.id.trim().toLowerCase() !== categoryName
            );

            // Populate the dropdown selection
            categoryItems.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.id;
                opt.textContent = `${item.id} - ${item.name}`;
                if (currentSelectedId && item.id.trim().toLowerCase() === currentSelectedId.trim().toLowerCase()) {
                    opt.selected = true;
                }
                selectEl.appendChild(opt);
            });

            // Make the search controls visible
            document.getElementById('search-section').style.display = 'block';

            // Button click handling
            document.getElementById('search-btn').addEventListener('click', function() {
                const dropdownValue = selectEl.value;
                const searchValue = document.getElementById('code-search').value.trim();

                // Prioritize text search if typed, otherwise use dropdown selection
                const targetId = searchValue ? searchValue : dropdownValue;

                if (targetId) {
                    const found = globalDatabase.find(row => row.id && row.id.trim().toLowerCase() === targetId.toLowerCase());
                    if (found) {
                        displayItem(found);
                        // Sync the dropdown selection to match the search result
                        selectEl.value = found.id;
                        document.getElementById('code-search').value = ""; // Clear text box
                    } else {
                        alert("Code '" + targetId + "' not found in database.");
                    }
                } else {
                    alert("Please select or type a specific code first.");
                }
            });
        }

        function displayItem(item) {
            document.getElementById('display-category').innerText = item.category || "Instrument";
            
            // Show the details card
            document.getElementById('details-section').style.display = 'block';
            document.getElementById('item-name').innerText = item.name || "Unknown";
            document.getElementById('item-code').innerText = item.id || "N/A";
            document.getElementById('item-desc').innerText = item.desc || "No description available.";
        }

        function showError(title, message) {
            document.getElementById('display-category').innerText = "Error";
            document.getElementById('display-category').classList.add('error');
            document.getElementById('display-title').innerText = title;
            document.getElementById('display-desc').innerText = message;
            document.getElementById('search-section').style.display = 'none';
            document.getElementById('details-section').style.display = 'none';
        }
    </script>
</body>
</html>
